# Example inventory. In a real setup this lives with (or is extracted from)
# your PRD/HLD — reqtrace only does the arithmetic.
#
# Statuses: extracted | assumed | confirmed | disputed | retired.
# Only confirmed/assumed (at the current rev) count toward coverage.
# rating is [value, risk], each H|M|L; the value drives by-rating severity.

- id: req~login-throttling~1
  statement: "When a user fails login 5 times in 10 minutes, throttle further attempts."
